<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian developer terminal background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#090D14"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- SDE Ember Orange Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>

    <!-- Subtle neon glow for the developer slash -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded developer badge tile with ember accent border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#bgGrad)" stroke="#FF5722" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Left Code Bracket < -->
  <path d="M22 20L11 32L22 44" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- SDE Forward Slash / in glowing signature ember orange -->
  <path d="M37 16L27 48" fill="none" stroke="url(#slashGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Right Code Bracket > -->
  <path d="M42 20L53 32L42 44" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
